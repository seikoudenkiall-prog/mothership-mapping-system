name: Mapping Accuracy Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install numpy scipy pandas pytest
      - name: Run 30mm Accuracy Test
        run: |
          python3 -m pytest tests/test_accuracy.py -v -s
